name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, intl, sodium, fileinfo
          coverage: xdebug

      - run: composer install --no-interaction --prefer-dist

      # Fails the build on a known-vulnerable dependency. A framework that sells security
      # must not ship one. Three symfony/yaml DoS advisories sat in the lock unnoticed
      # until a hand-run audit found them, because nothing checked.
      - name: Dependency audit
        run: composer audit --no-interaction

      - name: Static analysis
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests with coverage
        run: php vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
