name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})

    env:
      ZEPHYRUS_TEST_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=postgres;user=postgres;password=postgres

    services:
      postgres:
        # Dependabot does not update this digest. Refresh it with: docker buildx imagetools inspect postgres:16
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d # 16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            deps: locked
            coverage: true
            checks: true
          - php: '8.5'
            deps: locked
            coverage: false
            checks: false
          - php: '8.4'
            deps: lowest
            coverage: false
            checks: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, intl, sodium, fileinfo, apcu
          ini-values: apc.enable_cli=1
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Validate composer.json
        if: matrix.checks
        run: composer validate --strict --no-interaction

      - name: Install locked dependencies
        if: matrix.deps == 'locked'
        run: composer install --no-interaction --prefer-dist

      - name: Install lowest dependencies
        if: matrix.deps == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction

      # Fails on a known-vulnerable dependency: a security framework must not ship one.
      - name: Dependency audit
        if: matrix.checks
        run: composer audit --no-interaction

      - name: Static analysis
        if: matrix.checks
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests with coverage
        if: matrix.coverage
        run: php vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: php vendor/bin/phpunit

      - name: Upload coverage to Codecov
        if: success() && matrix.coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  commits:
    runs-on: ubuntu-24.04
    name: Commit messages

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ ]]; }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! is_sha "$PR_BASE_SHA" || ! is_sha "$PR_HEAD_SHA"; then
              echo "::error::unexpected base or head SHA"
              exit 1
            fi
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          else
            if ! is_sha "$HEAD_SHA"; then
              echo "::error::unexpected commit SHA"
              exit 1
            fi
            range="$HEAD_SHA^!"
            if is_sha "$PUSH_BEFORE_SHA" && ! [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              if git merge-base --is-ancestor "$PUSH_BEFORE_SHA" "$HEAD_SHA" 2>/dev/null; then
                range="$PUSH_BEFORE_SHA..$HEAD_SHA"
              else
                git fetch --no-tags origin "$PUSH_BEFORE_SHA" >/dev/null 2>&1 \
                  || echo "could not fetch $PUSH_BEFORE_SHA; trying the local history"
                if base=$(git merge-base "$PUSH_BEFORE_SHA" "$HEAD_SHA" 2>/dev/null); then
                  range="$base..$HEAD_SHA"
                  echo "The previous tip is not an ancestor (force push): checking $base..$HEAD_SHA"
                else
                  echo "No merge base with the previous tip: checking the new tip only"
                fi
              fi
            fi
          fi

          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check commit messages
        env:
          RANGE: ${{ steps.range.outputs.range }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/check-commit-messages.sh "$RANGE"
